    <main class="contact-page container">
      <section class="contact-intro"><p class="eyebrow">MARI TERHUBUNG</p><h1>Ada ide?<br /><em>Mulai percakapan.</em></h1><p>Silakan kirim pesan untuk konsultasi, kolaborasi proyek, atau sekadar menyapa.</p><div class="contact-detail"><p>EMAIL</p><a href="mailto:fatihathala@email.com">fatihathala@email.com</a></div><div class="contact-detail"><p>LOKASI</p><span>Indonesia</span></div></section>
      <section class="form-panel" aria-labelledby="form-title"><h2 id="form-title">Kirim pesan</h2><form action="#" method="post"><div class="field"><label for="name">Nama lengkap</label><input id="name" name="name" type="text" placeholder="Masukkan nama Anda" required /></div><div class="field"><label for="email">Alamat email</label><input id="email" name="email" type="email" placeholder="nama@email.com" required /></div><div class="field"><label for="category">Kategori / keperluan</label><select id="category" name="category" required><option value="" selected disabled>Pilih keperluan Anda</option><option>Konsultasi</option><option>Kolaborasi Proyek</option><option>Pertanyaan Umum</option></select></div><div class="field"><label for="message">Pesan</label><textarea id="message" name="message" rows="5" placeholder="Tuliskan pesan Anda di sini..." required></textarea></div><button class="button" type="submit">Kirim pesan <span aria-hidden="true">→</span></button></form></section>
    </main>
